---
- name: Include distro specific GUI tasks
  ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}.yml"

- name: Install common GUI applications
  block:
    - name: Install common GUI apps on Debian family
      ansible.builtin.apt:
        name: "{{ gui_apps_common + gui_apps_debian }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install common GUI apps on RedHat family
      ansible.builtin.dnf:
        name: "{{ gui_apps_common + gui_apps_redhat }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install common GUI apps on Arch family
      community.general.pacman:
        name: "{{ gui_apps_common + gui_apps_arch }}"
        state: present
      when: ansible_os_family == "Archlinux"

- name: Install Postman via snap
  ansible.builtin.command: snap install postman
  register: postman_result
  changed_when: "'already installed' not in postman_result.stdout | lower"
  failed_when: false
  when: postman_install | bool
