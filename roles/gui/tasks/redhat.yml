---
- name: Add Google Chrome repository on RedHat family
  ansible.builtin.yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: http://dl.google.com/linux/chrome/rpm/stable/$basearch
    enabled: true
    gpgcheck: true
    gpgkey: https://dl-ssl.google.com/linux/linux_signing_key.pub

- name: Add Brave repository on RedHat family
  ansible.builtin.yum_repository:
    name: brave-browser
    description: Brave Browser
    baseurl: https://brave-browser-rpm-release.s3.brave.com/$basearch
    enabled: true
    gpgcheck: true
    gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc

- name: Add Sublime Text repository on RedHat family
  ansible.builtin.yum_repository:
    name: sublime-text
    description: Sublime Text
    baseurl: https://download.sublimetext.com/rpm/dev/$releasever/$basearch
    enabled: true
    gpgcheck: true
    gpgkey: https://download.sublimetext.com/sublimehq-pub.gpg

- name: Add OnlyOffice repository on RedHat family
  ansible.builtin.yum_repository:
    name: onlyoffice
    description: OnlyOffice
    baseurl: https://repo.onlyoffice.com/centos/$releasever/x86_64
    enabled: true
    gpgcheck: true
    gpgkey: https://repo.onlyoffice.com/centos/onlyoffice.key
