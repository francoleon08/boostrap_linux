---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: vscode_install | bool

- name: Find existing VS Code apt source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: "packages.microsoft.com/repos/code"
  register: vscode_source_files
  when: vscode_install | bool

- name: Remove existing VS Code apt source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vscode_source_files.files | default([]) }}"
  when: vscode_install | bool

- name: Download Microsoft GPG key on Debian family
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/microsoft.asc
    mode: "0644"
  when: vscode_install | bool

- name: Convert Microsoft key to gpg keyring
  ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg /tmp/microsoft.asc
  args:
    creates: /etc/apt/keyrings/packages.microsoft.gpg
  when: vscode_install | bool

- name: Add VS Code repository on Debian family
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present
  when: vscode_install | bool

- name: Install packages on Debian family
  ansible.builtin.apt:
    update_cache: true
    name: "{{ base_packages_common + base_packages_debian_extra + (docker_packages_debian if (docker_install | bool) else []) + (['code'] if (vscode_install | bool) else []) }}"
    state: present
