---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: vscode_install | bool

- name: Find existing VS Code apt source files
  ansible.builtin.shell: |
    grep -Rsl 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
  register: vscode_source_files
  changed_when: false
  when: vscode_install | bool

- name: Remove existing VS Code apt source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vscode_source_files.stdout_lines | default([]) }}"
  when: vscode_install | bool

- name: Download Microsoft GPG key on Debian family
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/microsoft.asc
    mode: "0644"
  when: vscode_install | bool

- name: Convert Microsoft key to gpg keyring
  ansible.builtin.command: gpg --dearmor -o /usr/share/keyrings/microsoft.gpg /tmp/microsoft.asc
  args:
    creates: /usr/share/keyrings/microsoft.gpg
  when: vscode_install | bool

- name: Add VS Code repository on Debian family
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vscode.list
    content: "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main\n"
    mode: "0644"
  when: vscode_install | bool

- name: Install packages on Debian family
  ansible.builtin.apt:
    update_cache: true
    name: "{{ base_packages_common + base_packages_debian_extra + (docker_packages_debian if (docker_install | bool) else []) + (['code'] if (vscode_install | bool) else []) }}"
    state: present
