---
- name: Ensure docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
  when: docker_manage_daemon_config | bool

- name: Write docker daemon configuration
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    mode: "0644"
  when: docker_manage_daemon_config | bool
  notify: Restart docker

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Ensure docker users are in docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0

- name: Ensure docker users are in admin group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ docker_admin_group_by_os_family[ansible_os_family] }}"
    append: true
  loop: "{{ docker_users }}"
  when:
    - docker_add_users_to_admin_group | bool
    - docker_users | length > 0
    - ansible_os_family in docker_admin_group_by_os_family

- name: Check Docker Compose plugin locations
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ docker_compose_plugin_paths }}"
  register: docker_compose_plugins

- name: Determine if Docker Compose plugin is installed
  ansible.builtin.set_fact:
    docker_compose_installed: "{{ docker_compose_plugins.results | selectattr('stat.exists') | list | length > 0 }}"

- name: Ensure Docker CLI plugins directory exists
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"
  when:
    - docker_compose_fallback_install | bool
    - not docker_compose_installed | bool

- name: Install Docker Compose plugin fallback
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ compose_arch }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "0755"
  vars:
    compose_arch: "{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}"
  when:
    - docker_compose_fallback_install | bool
    - not docker_compose_installed | bool
