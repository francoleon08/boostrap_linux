---
- name: Ensure VS Code user config directory exists
  ansible.builtin.file:
    path: "{{ bootstrap_home }}/.config/Code/User"
    state: directory
    mode: "0755"
    owner: "{{ bootstrap_user }}"
    group: "{{ bootstrap_user }}"

- name: Write VS Code settings.json
  ansible.builtin.copy:
    content: "{{ vscode_settings | to_nice_json }}\n"
    dest: "{{ bootstrap_home }}/.config/Code/User/settings.json"
    mode: "0644"
    owner: "{{ bootstrap_user }}"
    group: "{{ bootstrap_user }}"
    force: false

- name: Install VS Code extensions
  ansible.builtin.command: "code --install-extension {{ item }} --force"
  loop: "{{ vscode_extensions }}"
  register: vscode_ext_result
  changed_when: "'is already installed' not in vscode_ext_result.stdout | lower"
  failed_when: false
  become: false
  environment:
    HOME: "{{ bootstrap_home }}"
  when: vscode_extensions | length > 0
