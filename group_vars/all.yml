---
bootstrap_user: "{{ ansible_user_id }}"
bootstrap_shell: /bin/bash
bootstrap_home: "{{ lookup('env', 'HOME') }}"

base_packages_common:
  - curl
  - wget
  - git
  - unzip
  - htop
  - tree
  - stow

base_packages_debian_extra:
  - build-essential
  - ca-certificates

base_packages_redhat_extra:
  - gcc
  - gcc-c++
  - make
  - ca-certificates

base_packages_arch_extra:
  - base-devel
  - ca-certificates

services_to_enable: []

dotfiles_repo_url: ""
dotfiles_repo_dest: "{{ bootstrap_home }}/.dotfiles"

git_global_config:
  - key: user.name
    value: francoleon08
  - key: user.email
    value: francoleon284@gmail.com
  - key: core.autocrlf
    value: input

docker_install: true
docker_users:
  - "{{ bootstrap_user }}"

docker_packages_debian:
  - docker.io

docker_use_official_repo_redhat: true
docker_repo_baseurl_redhat: "{{ 'https://download.docker.com/linux/fedora/$releasever/$basearch/stable' if ansible_distribution == 'Fedora' else 'https://download.docker.com/linux/centos/$releasever/$basearch/stable' }}"

docker_packages_redhat:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_packages_arch:
  - docker

docker_manage_daemon_config: true
docker_daemon_config:
  iptables: true
  ip-forward: true

docker_compose_fallback_install: true
docker_compose_version: v5.1.3
docker_compose_plugin_paths:
  - /usr/libexec/docker/cli-plugins/docker-compose
  - /usr/local/lib/docker/cli-plugins/docker-compose

vscode_install: true
vscode_extensions:
  - ms-python.python
  - esbenp.prettier-vscode
  - ms-vscode.cpptools

vscode_settings:
  editor.fontSize: 14
  editor.formatOnSave: true
  files.autoSave: afterDelay
  workbench.colorTheme: Default Dark Modern

gui_install: true

gui_apps_common:
  - thunderbird

gui_apps_debian:
  - google-chrome-stable
  - brave-browser

gui_apps_redhat:
  - google-chrome-stable
  - brave-browser

gui_apps_arch:
  - google-chrome
  - brave-bin

postman_install: true
postman_version: latest
postman_install_method: snap
